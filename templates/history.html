{% extends "layout.html" %}
{% block content %}

<h2 class="mt-4">Prediction History</h2>

<table class="table table-dark mt-3">
<tr>
<th>ID</th>
<th>Weight</th>
<th>Fragility</th>
<th>Material</th>
<th>CO2</th>
<th>Cost</th>
</tr>

{% for row in data %}
<tr>
<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
<td>{{row[3]}}</td>
<td>{{row[4]}}</td>
<td>{{row[5]}}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
