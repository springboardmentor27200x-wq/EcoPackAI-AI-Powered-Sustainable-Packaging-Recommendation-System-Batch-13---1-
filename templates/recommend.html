{% extends "layout.html" %}
{% block content %}

<h2 class="mb-4">Sustainable Material Recommendation</h2>

<form method="POST" action="/recommend">

<div class="row">

<div class="col-md-6 mb-3">
<label>Product Name</label>
<input type="text" name="product_name" class="form-control" placeholder="e.g., Smartphone, Organic Coffee">
</div>

<div class="col-md-6 mb-3">
<label>Product Category</label>
<select name="category" class="form-control">
<option>Electronics</option>
<option>Food</option>
<option>Cosmetics</option>
<option>Clothing</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Product Weight (kg)</label>
<input type="number" step="0.1" name="weight" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Fragility Level</label>
<select name="fragility" class="form-control">
<option value="2">Low</option>
<option value="5">Medium</option>
<option value="9">High</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Shipping Type</label>
<select name="shipping" class="form-control">
<option>Standard</option>
<option>Express</option>
<option>International</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Priority Balance</label>
<input type="range" min="1" max="10" name="priority" class="form-range">
<div class="d-flex justify-content-between">
<span>💰 Cost</span>
<span>🌱 Eco</span>
</div>
</div>

</div>

<button class="btn btn-success w-100 mt-3">Get Recommendation</button>

</form>

{% if result %}

<h3 class="mt-5">Top Recommended Materials</h3>

<table class="table table-dark mt-3">
<tr>
<th>Material</th>
<th>Cost Index</th>
<th>CO₂ Score</th>
<th>Rank Score</th>
</tr>

<tr>
<td>{{result.material}}</td>
<td>{{result.cost}}</td>
<td>{{result.co2}}</td>
<td>1</td>
</tr>

</table>

{% endif %}

{% endblock %}
