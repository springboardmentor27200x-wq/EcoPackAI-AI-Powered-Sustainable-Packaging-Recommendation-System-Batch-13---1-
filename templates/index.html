<!DOCTYPE html>
<html>
<head>

<title>EcoPackAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">Sustainable Material Recommendation</h2>

<div class="card p-4">

<div class="row">
<div class="col">
<input class="form-control" id="weight" placeholder="Weight (kg)">
</div>

<div class="col">
<select class="form-control" id="strength">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>
</div>
</div>

<button class="btn btn-success mt-3 w-100" onclick="getRecommendation()">Get AI Recommendation</button>

</div>

<h3 class="mt-5">Top Recommended Materials</h3>

<table class="table table-dark table-striped mt-3">
<thead>
<tr>
<th>Material</th>
<th>Cost Index</th>
<th>CO2 Score</th>
<th>Rank Score</th>
</tr>
</thead>

<tbody id="tableData">
</tbody>

</table>

</div>

<script>

function getRecommendation(){

fetch("/recommend",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
weight:document.getElementById("weight").value,
strength:document.getElementById("strength").value
})
})
.then(res=>res.json())
.then(data=>{

let rows="";

data.forEach(m=>{
rows += `
<tr>
<td>${m.material_name}</td>
<td>${m.cost_index.toFixed(3)}</td>
<td>${m.co2_score.toFixed(3)}</td>
<td><span class="badge bg-primary">${m.rank_score.toFixed(3)}</span></td>
</tr>
`
})

document.getElementById("tableData").innerHTML = rows;

})

}

</script>

</body>
</html>
