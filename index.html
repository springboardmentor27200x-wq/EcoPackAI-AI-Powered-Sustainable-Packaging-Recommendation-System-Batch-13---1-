<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPackAI Dashboard</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
header { padding:15px 30px; background:#2e7d32; color:#fff; font-weight:bold; }
.container { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:20px; }
.card { background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
button { width:100%; padding:10px; background:#2e7d32; color:#fff; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#256428; }
.input-group { margin-bottom:10px; }
input { width:100%; padding:8px; border:1px solid #ccc; border-radius:5px; }
.insights, .charts { grid-column: span 2; }
</style>
</head>

<body>

<header>EcoPackAI - Business Intelligence Dashboard</header>

<div class="container">

<!-- INPUT -->
<div class="card">
<h3>Input Parameters</h3>

<div class="input-group">
<input id="weight" type="number" placeholder="Weight (g)">
</div>

<div class="input-group">
<input id="strength" type="number" placeholder="Strength">
</div>

<!-- OPTIONAL ADVANCED INPUTS -->
<h4>Advanced (Optional)</h4>

<div class="input-group">
<input id="capacity" type="number" placeholder="Weight Capacity (default 0.8)">
</div>

<div class="input-group">
<input id="biodeg" type="number" placeholder="Biodegradability (default 0.6)">
</div>

<div class="input-group">
<input id="recycle" type="number" placeholder="Recyclability % (default 50)">
</div>

<button onclick="predict()">Run Prediction</button>
</div>

<!-- OUTPUT -->
<div class="card">
<h3>Results</h3>
<p>Cost: ₹<span id="cost">--</span></p>
<p>CO₂: <span id="co2">--</span></p>
<p>Eco Score: <span id="eco">--</span></p>
<p>Total Predictions: <span id="count">0</span></p>
</div>

<!-- INSIGHTS -->
<div class="card insights">
<h3>Insights</h3>
<p id="insight">Run prediction</p>
<button onclick="downloadReport()">Download Report</button>
</div>

<!-- CHARTS -->
<div class="card charts">
<h3>Analytics</h3>
<div id="chart1"></div>
<div id="chart2"></div>
</div>

</div>

<script>

let historyData = [];

async function predict() {

  const weight = document.getElementById('weight').value;
  const strength = document.getElementById('strength').value;

  // Optional inputs
  const capacity = document.getElementById('capacity').value || 0.8;
  const biodeg = document.getElementById('biodeg').value || 0.6;
  const recycle = document.getElementById('recycle').value || 50;

  if (!weight || !strength) {
    alert("Please enter weight and strength");
    return;
  }

  const res = await fetch('/predict', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      weight,
      strength,
      weight_capacity: capacity,
      biodegradability: biodeg,
      recyclability: recycle
    })
  });

  const data = await res.json();

  if (data.error) {
    alert(data.error);
    return;
  }

  const result = data.data;

  document.getElementById('cost').innerText = result.predicted_cost.toFixed(2);
  document.getElementById('co2').innerText = result.predicted_co2.toFixed(0);

  let eco = Math.max(0, 100 - (result.predicted_co2 / 1000 + result.predicted_cost));
  document.getElementById('eco').innerText = eco.toFixed(2);

  historyData.push({
    cost: result.predicted_cost,
    co2: result.predicted_co2
  });

  document.getElementById('count').innerText = historyData.length;

  document.getElementById('insight').innerText =
    result.predicted_co2 > 60000
      ? "High carbon impact. Switch to eco-friendly materials."
      : result.predicted_co2 > 30000
      ? "Moderate sustainability. Optimization possible."
      : "Excellent sustainable choice.";

  updateCharts();
}

function updateCharts() {
  const cost = historyData.map(x => x.cost);
  const co2 = historyData.map(x => x.co2);

  Plotly.react('chart1', [{ y: cost, type: 'scatter' }], { title: 'Cost Trend' });
  Plotly.react('chart2', [{ y: co2, type: 'bar' }], { title: 'CO₂ Trend' });
}

function downloadReport() {
  const content = `EcoPackAI Report

Total Predictions: ${historyData.length}

Data:
${JSON.stringify(historyData, null, 2)}`;

  const blob = new Blob([content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'EcoPackAI_Report.txt';
  a.click();
}

</script>

</body>
</html>
